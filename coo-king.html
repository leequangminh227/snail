<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coo-king Calculator - Multi Set</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .section h2 {
            color: #764ba2;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: #e9ecef;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #dee2e6;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .input-group input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f1f3f5;
        }

        .profit-positive {
            color: #28a745;
            font-weight: 600;
        }

        .profit-negative {
            color: #dc3545;
            font-weight: 600;
        }

        .checkbox-cell {
            width: 50px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        input[type="number"].price-input {
            width: 100px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            text-align: center;
        }

        .strategy-section {
            background: #ffffff;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .strategy-section h2 {
            color: #764ba2;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .strategy-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .strategy-card.highlight {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            border-left-color: #ffd700;
        }

        .cooking-step {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .step-number {
            background: #667eea;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .total-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .total-box h3 {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-box .amount {
            font-size: 3em;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .comparison-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .set-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #eee;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .set-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .set-card.best {
            border: 2px solid #ffd700;
            background: #fffdf0;
        }

        .set-card.best::before {
            content: "KHUYÊN DÙNG";
            position: absolute;
            top: 10px;
            right: -30px;
            background: #ffd700;
            color: #333;
            padding: 5px 40px;
            font-size: 0.7em;
            font-weight: bold;
            transform: rotate(45deg);
        }

        .info-pill {
            display: inline-block;
            padding: 4px 12px;
            background: #e9ecef;
            border-radius: 20px;
            font-size: 0.85em;
            color: #495057;
            margin-top: 10px;
        }

        .explanation-box {
            background: #eef2ff;
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            border-left: 5px solid #17a2b8;
        }

        .explanation-box h4 {
            color: #17a2b8;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Buttons */
        .back-button,
        .reset-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid #667eea;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95em;
        }

        .back-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .reset-button {
            color: #dc3545;
            border-color: #dc3545;
        }

        .reset-button:hover {
            background: #dc3545;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        /* Badges for table */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-best {
            background: #fff9db;
            color: #f08c00;
            border: 1px solid #ffe066;
        }

        .badge-good {
            background: #ebfbee;
            color: #2b8a3e;
            border: 1px solid #b2f2bb;
        }

        .badge-bad {
            background: #fff5f5;
            color: #c92a2a;
            border: 1px solid #ffc9c9;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            table {
                font-size: 14px;
            }

            th,
            td {
                padding: 8px 4px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🍳 Coo-king Calculator - Multi Set</h1>
        <div
            style="text-align: center; margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="back-button">← Quay lại trang chủ</a>
            <button onclick="resetToDefault()" class="reset-button">🔄 Reset về mặc định</button>
        </div>

        <!-- Tabs cho các Set -->
        <div class="tabs" id="setTabs">
            <!-- Sẽ được tạo bằng JavaScript -->
        </div>

        <!-- Tab Contents -->
        <div id="tabContents">
            <!-- Sẽ được tạo bằng JavaScript -->
        </div>

        <!-- So sánh giữa các Set -->
        <div class="comparison-section">
            <h2>🏆 So Sánh Giữa Các Set</h2>
            <div id="setComparison">
                <!-- Sẽ được tạo bằng JavaScript -->
            </div>
        </div>

        <!-- Phân tích tổng thể -->
        <div class="strategy-section">
            <h2>💡 Phân Tích Chiến Lược Tối Ưu</h2>
            <div id="overallStrategy">
                <!-- Sẽ được tạo bằng JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Cấu trúc dữ liệu cho mỗi Set
        const SETS = {
            set1: {
                id: 'set1',
                name: 'Set 1 (Đảo Hề)',
                foodPrices: { food1: 29, food2: 86, food3: 156 },
                dishes: [
                    { id: 1, name: 'Sâu hồi', food1: 1, food2: 0, food3: 0, price: 20 }, //full
                    { id: 2, name: 'Hamburger', food1: 3, food2: 0, food3: 0, price: 86 }, //full
                    { id: 3, name: 'Salad', food1: 5, food2: 0, food3: 0, price: 192 }, //full
                    { id: 4, name: 'Pudding', food1: 2, food2: 1, food3: 0, price: 154 }, //full
                    { id: 5, name: 'Gumball', food1: 3, food2: 2, food3: 0, price: 288 }, //full
                    { id: 6, name: 'Thần lằn', food1: 4, food2: 2, food3: 0, price: 364 }, //full
                    { id: 7, name: 'Xương bò ma', food1: 6, food2: 3, food3: 0, price: 590 }, //full
                    { id: 8, name: 'Tinh linh máu', food1: 8, food2: 4, food3: 0, price: 844 }, //full
                    { id: 9, name: 'Phô mai giòi', food1: 10, food2: 6, food3: 0, price: 1258 }, //full
                    { id: 10, name: 'Súp đặc mắt nhện', food1: 5, food2: 2, food3: 1, price: 672 }, //full
                    { id: 11, name: 'Chân sư tử', food1: 8, food2: 5, food3: 3, price: 1680 }, //full
                    { id: 12, name: 'Bánh quy pho mát', food1: 20, food2: 10, food3: 5, price: 3600 } //full
                ]
            },
            set2: {
                id: 'set2',
                name: 'Set 2 (Đảo Hải sản)',
                foodPrices: { food1: 36, food2: 108, food3: 195 },
                dishes: [
                    // THÊM CÁC MÓN ĂN SET 2 TẠI ĐÂY
                    { id: 1, name: 'Hàu nướng', food1: 1, food2: 0, food3: 0, price: 24 }, //full
                    { id: 2, name: 'Bạch tuộc ngâm', food1: 3, food2: 0, food3: 0, price: 108 }, //full
                    { id: 3, name: 'Shasimi cá đuối', food1: 5, food2: 0, food3: 0, price: 240 }, //full
                    { id: 4, name: 'Tôm kỳ lạ', food1: 2, food2: 1, food3: 0, price: 192 }, //full
                    { id: 5, name: 'Phô mai muối', food1: 4, food2: 2, food3: 0, price: 456 }, //full
                    { id: 6, name: 'Thuỷ Long Nướng', food1: 6, food2: 3, food3: 0, price: 738 }, //full
                    { id: 7, name: 'Cánh cá người', food1: 5, food2: 2, food3: 1, price: 840 }, // full
                    { id: 8, name: 'Rắn biển', food1: 8, food2: 4, food3: 0, price: 1056 }, //full
                    { id: 9, name: 'Rồng biển xào', food1: 3, food2: 2, food3: 0, price: 360 },//full
                    { id: 10, name: 'Cá mập sừng ma', food1: 8, food2: 5, food3: 3, price: 2100 }, //full
                    { id: 11, name: 'Mực máu ngân rượu', food1: 10, food2: 6, food3: 0, price: 1572 }, //full
                    { id: 12, name: 'Súp vi lao', food1: 20, food2: 10, food3: 5, price: 3375 }
                ]
            },
            set3: {
                id: 'set3',
                name: 'Set 3 (Đảo Thú)',
                foodPrices: { food1: 48, food2: 144, food3: 260 },
                dishes: [
                    // THÊM CÁC MÓN ĂN SET 3 TẠI ĐÂY
                    { id: 1, name: 'Bánh quy nhện', food1: 1, food2: 0, food3: 0, price: 32 }, //full
                    { id: 2, name: 'Thịt hầm kỳ nhông', food1: 3, food2: 0, food3: 0, price: 144 }, //full
                    { id: 3, name: 'Rượu lửa', food1: 5, food2: 0, food3: 0, price: 320 }, //full
                    { id: 4, name: 'Pudding nhện', food1: 2, food2: 1, food3: 0, price: 256 }, //full
                    { id: 5, name: 'Nhện sói 1 mắt', food1: 3, food2: 2, food3: 0, price: 480 }, //full
                    { id: 6, name: 'Nước ngọt hoa quả', food1: 4, food2: 2, food3: 0, price: 608 }, //full
                    { id: 7, name: 'Chim báo tang', food1: 6, food2: 3, food3: 0, price: 984 }, //full
                    { id: 8, name: 'Móng người sói', food1: 8, food2: 4, food3: 0, price: 844 },
                    { id: 9, name: 'Trứng rồng lửa', food1: 10, food2: 6, food3: 0, price: 1572 },
                    { id: 10, name: 'Bánh giòn cá', food1: 5, food2: 2, food3: 1, price: 672 },
                ]
            }
            // Thêm set3, set4,... tại đây
        };

        // Tỷ lệ rơi nguyên liệu mặc định
        const DEFAULT_FOOD_DROP_RATE = {
            food1: 0.65,  // 65%
            food2: 0.25,  // 25%
            food3: 0.10   // 10%
        };

        // State cho mỗi set
        let setStates = {};
        let currentSet = 'set1';

        // Load từ localStorage
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('coo-king-multi-set-states');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    console.error('Lỗi khi load localStorage:', e);
                    return {};
                }
            }
            return {};
        }

        // Lưu vào localStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem('coo-king-multi-set-states', JSON.stringify(setStates));
            } catch (e) {
                console.error('Lỗi khi lưu localStorage:', e);
            }
        }

        // Khởi tạo state cho các set
        function initializeStates() {
            const savedStates = loadFromLocalStorage();

            Object.keys(SETS).forEach(setKey => {
                const set = SETS[setKey];
                const savedSetState = savedStates[setKey];

                setStates[setKey] = {
                    dishes: set.dishes.map(dish => {
                        if (savedSetState) {
                            const savedDish = savedSetState.dishes.find(d => d.id === dish.id);
                            if (savedDish) {
                                return {
                                    ...dish,
                                    enabled: savedDish.enabled !== undefined ? savedDish.enabled : true,
                                    price: savedDish.price !== undefined ? savedDish.price : dish.price
                                };
                            }
                        }
                        return { ...dish, enabled: true };
                    }),
                    ingredients: savedSetState?.ingredients || { food1: 650, food2: 250, food3: 100 },
                    foodDropRate: savedSetState?.foodDropRate || { ...DEFAULT_FOOD_DROP_RATE }
                };
            });
        }

        // Update food rates cho từng set
        function updateFoodRates(setKey) {
            const rate1 = parseFloat(document.getElementById(`${setKey}-rate1`).value) || 0;
            const rate2 = parseFloat(document.getElementById(`${setKey}-rate2`).value) || 0;
            const rate3 = parseFloat(document.getElementById(`${setKey}-rate3`).value) || 0;

            setStates[setKey].foodDropRate = {
                food1: rate1 / 100,
                food2: rate2 / 100,
                food3: rate3 / 100
            };

            // Cập nhật tổng và cảnh báo
            const total = rate1 + rate2 + rate3;
            document.getElementById(`${setKey}-totalRate`).textContent = total.toFixed(2);

            const warning = document.getElementById(`${setKey}-rateWarning`);
            if (Math.abs(total - 100) > 0.01) {
                warning.style.display = 'inline';
            } else {
                warning.style.display = 'none';
            }

            // Cập nhật label của nguyên liệu
            const set = SETS[setKey];
            document.getElementById(`${setKey}-food1-label`).textContent =
                `Food 1 (${rate1.toFixed(0)}% - Giá lẻ: ${set.foodPrices.food1})`;
            document.getElementById(`${setKey}-food2-label`).textContent =
                `Food 2 (${rate2.toFixed(0)}% - Giá lẻ: ${set.foodPrices.food2})`;
            document.getElementById(`${setKey}-food3-label`).textContent =
                `Food 3 (${rate3.toFixed(0)}% - Giá lẻ: ${set.foodPrices.food3})`;

            saveToLocalStorage();
            renderDishTable(setKey);
            const result = calculateSetStrategy(setKey);
            displaySetStrategy(setKey, result);
            displayComparison();
        }

        // Tính chi phí cơ hội
        function calculateOpportunityCost(dish, setKey) {
            const foodPrices = SETS[setKey].foodPrices;
            return dish.food1 * foodPrices.food1 +
                dish.food2 * foodPrices.food2 +
                dish.food3 * foodPrices.food3;
        }

        // Đánh giá món ăn (dựa trên hiệu suất + lợi nhuận)
        function getRating(profit, efficiency = 0) {
            // Ưu tiên hiệu suất hơn lợi nhuận tuyệt đối
            if (efficiency >= 100 && profit >= 300) return '<span class="badge badge-best">⭐ XUẤT SẮC</span>';
            if (efficiency >= 60 || profit >= 200) return '<span class="badge badge-good">✓✓✓ Rất tốt</span>';
            if (efficiency >= 30 || profit >= 100) return '<span class="badge badge-good">✓✓ Tốt</span>';
            if (efficiency >= 10 || profit >= 20) return '<span class="badge badge-good">✓ Khá</span>';
            return '<span class="badge badge-bad">❌ Tệ</span>';
        }

        // Tạo tabs
        function createTabs() {
            const tabsContainer = document.getElementById('setTabs');
            tabsContainer.innerHTML = Object.keys(SETS).map((setKey, index) =>
                `<div class="tab ${index === 0 ? 'active' : ''}" onclick="switchTab('${setKey}')">
                    ${SETS[setKey].name}
                </div>`
            ).join('');
        }

        // Switch tab
        function switchTab(setKey) {
            currentSet = setKey;

            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update active content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`content-${setKey}`).classList.add('active');
        }

        // Tạo nội dung cho mỗi tab
        function createTabContents() {
            const container = document.getElementById('tabContents');
            container.innerHTML = Object.keys(SETS).map((setKey, index) => {
                const set = SETS[setKey];
                return `
                    <div id="content-${setKey}" class="tab-content ${index === 0 ? 'active' : ''}">
        <div class="section">
                            <h2>⚙️ Tỷ Lệ Rơi Nguyên Liệu</h2>
            <div class="input-grid">
                <div class="input-group">
                                    <label>Food 1 (%):</label>
                                    <input type="number" id="${setKey}-rate1" value="${(setStates[setKey].foodDropRate.food1 * 100).toFixed(2)}" 
                                           step="0.01" min="0" max="100" onchange="updateFoodRates('${setKey}')">
                </div>
                <div class="input-group">
                                    <label>Food 2 (%):</label>
                                    <input type="number" id="${setKey}-rate2" value="${(setStates[setKey].foodDropRate.food2 * 100).toFixed(2)}" 
                                           step="0.01" min="0" max="100" onchange="updateFoodRates('${setKey}')">
                </div>
                <div class="input-group">
                                    <label>Food 3 (%):</label>
                                    <input type="number" id="${setKey}-rate3" value="${(setStates[setKey].foodDropRate.food3 * 100).toFixed(2)}" 
                                           step="0.01" min="0" max="100" onchange="updateFoodRates('${setKey}')">
                </div>
            </div>
                            <div style="margin-top: 10px; color: #666; font-size: 0.9em;">
                                <strong>Tổng:</strong> <span id="${setKey}-totalRate">100.00</span>%
                                <span id="${setKey}-rateWarning" style="color: #ff6b6b; margin-left: 10px; display: none;">⚠️ Tổng tỷ lệ nên bằng 100%</span>
                            </div>
        </div>

        <div class="section">
                            <h2>📦 Nguyên Liệu ${set.name}</h2>
            <div class="input-grid">
                <div class="input-group">
                                    <label id="${setKey}-food1-label">Food 1 (${(setStates[setKey].foodDropRate.food1 * 100).toFixed(0)}% - Giá lẻ: ${set.foodPrices.food1})</label>
                                    <input type="number" id="${setKey}-food1" value="${setStates[setKey].ingredients.food1}" min="0" 
                                           onchange="updateIngredients('${setKey}')">
                </div>
                <div class="input-group">
                                    <label id="${setKey}-food2-label">Food 2 (${(setStates[setKey].foodDropRate.food2 * 100).toFixed(0)}% - Giá lẻ: ${set.foodPrices.food2})</label>
                                    <input type="number" id="${setKey}-food2" value="${setStates[setKey].ingredients.food2}" min="0"
                                           onchange="updateIngredients('${setKey}')">
                </div>
                <div class="input-group">
                                    <label id="${setKey}-food3-label">Food 3 (${(setStates[setKey].foodDropRate.food3 * 100).toFixed(0)}% - Giá lẻ: ${set.foodPrices.food3})</label>
                                    <input type="number" id="${setKey}-food3" value="${setStates[setKey].ingredients.food3}" min="0"
                                           onchange="updateIngredients('${setKey}')">

        // Render bảng món ăn cho 1 set
        function renderDishTable(setKey) {

        // Toggle món ăn

        function updatePrice(setKey, dishId, newPrice) {

        // Tính hiệu suất món ăn (xét tỷ lệ rơi nguyên liệu)
        function calculateDishEfficiency(dish, setKey) {
            const opportunityCost = calculateOpportunityCost(dish, setKey);
            const profit = dish.price - opportunityCost;

            // Lấy tỷ lệ rơi của set này
            const dropRate = setStates[setKey].foodDropRate;

            // Trọng số khan hiếm dựa trên tỷ lệ rơi (số càng cao = càng khan hiếm)
            // Nếu tỷ lệ rơi = 0, chỉ tính trọng số nếu món cần loại nguyên liệu đó
            // Nếu món không cần loại đó (dish.foodX = 0), trọng số = 0 để không ảnh hưởng
            const getWeight = (rate, needed) => {
                if (rate <= 0) {
                    // Nếu tỷ lệ rơi = 0 và món cần nguyên liệu này -> Infinity (không thể nấu)
                    // Nếu tỷ lệ rơi = 0 nhưng món không cần -> 0 (không ảnh hưởng)
                    return needed > 0 ? Infinity : 0;
                }
                return 1 / rate;
            };

            const scarcityWeights = {
                food1: getWeight(dropRate.food1, dish.food1),
                food2: getWeight(dropRate.food2, dish.food2),
                food3: getWeight(dropRate.food3, dish.food3)
            };

            // Tổng chi phí có trọng số (weighted cost)
            const weightedCost =
                dish.food1 * scarcityWeights.food1 +
                dish.food2 * scarcityWeights.food2 +
                dish.food3 * scarcityWeights.food3;

            // Hiệu suất = Lợi nhuận / Chi phí có trọng số
            // Món nào hiệu suất cao = tận dụng nguyên liệu tốt hơn
            // Nếu weightedCost = Infinity (cần nguyên liệu không rơi) -> hiệu suất = 0
            const efficiency = (weightedCost > 0 && isFinite(weightedCost)) ? profit / weightedCost : 0;

            return { profit, efficiency, weightedCost };
        }

        // Tính hiệu suất đơn giản dựa trên số lượng nguyên liệu (không dùng drop rate)
        function calculateSimpleEfficiency(dish, setKey) {
            const opportunityCost = calculateOpportunityCost(dish, setKey);
            const profit = dish.price - opportunityCost;

            // Hiệu suất đơn giản = lợi nhuận / tổng số nguyên liệu cần
            const totalIngredients = dish.food1 + dish.food2 + dish.food3;
            const efficiency = totalIngredients > 0 ? profit / totalIngredients : 0;

            return { profit, efficiency };
        }

        // Tính toán chiến lược cho 1 set (dựa trên nguyên liệu hiện tại)
        function calculateSetStrategy(setKey) {
            const ingredients = setStates[setKey].ingredients;
            const foodPrices = SETS[setKey].foodPrices;
            const enabledDishes = setStates[setKey].dishes.filter(d => d.enabled);

            // Tính tổng giá bán lẻ
            const totalRetail = ingredients.food1 * foodPrices.food1 +
                ingredients.food2 * foodPrices.food2 +
                ingredients.food3 * foodPrices.food3;

            // Tính lợi nhuận và hiệu suất đơn giản cho mỗi món
            const dishProfits = enabledDishes.map(dish => {
                const opportunityCost = calculateOpportunityCost(dish, setKey);
                const { profit, efficiency } = calculateSimpleEfficiency(dish, setKey);
                return { ...dish, opportunityCost, profit, efficiency };
            });

            // Sắp xếp theo lợi nhuận/nguyên liệu (hiệu suất đơn giản)
            dishProfits.sort((a, b) => b.efficiency - a.efficiency);

            // Greedy algorithm
            let remaining = { ...ingredients };
            let totalRevenue = 0;
            const strategy = [];

            for (const dish of dishProfits) {
                if (dish.profit <= 0) continue;

                let maxCook = Infinity;
                if (dish.food1 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food1 / dish.food1));
                if (dish.food2 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food2 / dish.food2));
                if (dish.food3 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food3 / dish.food3));

                if (maxCook > 0 && maxCook !== Infinity) {
                    const revenue = maxCook * dish.price;
                    const netProfit = maxCook * dish.profit;

                    remaining.food1 -= maxCook * dish.food1;
                    remaining.food2 -= maxCook * dish.food2;
                    remaining.food3 -= maxCook * dish.food3;
                    totalRevenue += revenue;

                    strategy.push({ dish, count: maxCook, revenue, netProfit });
                }
            }

            // Tính giá trị nguyên liệu dư
            const remainingValue = remaining.food1 * foodPrices.food1 +
                remaining.food2 * foodPrices.food2 +
                remaining.food3 * foodPrices.food3;

            const finalRevenue = totalRevenue + remainingValue;
            const profitIncrease = finalRevenue - totalRetail;
            const profitPercent = totalRetail > 0 ? (profitIncrease / totalRetail * 100) : 0;

            return {
                strategy,
                remaining,
                remainingValue,
                totalRevenue: totalRevenue,
                finalRevenue,
                totalRetail,
                profitIncrease,
                profitPercent
            };
        }

        // Tính toán chiến lược dựa trên drop rate (cho so sánh giữa các set)
        function calculateSetStrategyWithDropRate(setKey, ingredients) {
            const foodPrices = SETS[setKey].foodPrices;
            const enabledDishes = setStates[setKey].dishes.filter(d => d.enabled);

            // Tính tổng giá bán lẻ
            const totalRetail = ingredients.food1 * foodPrices.food1 +
                ingredients.food2 * foodPrices.food2 +
                ingredients.food3 * foodPrices.food3;

            // Tính lợi nhuận và hiệu suất (dùng drop rate) cho mỗi món
            const dishProfits = enabledDishes.map(dish => {
                const opportunityCost = calculateOpportunityCost(dish, setKey);
                const { profit, efficiency } = calculateDishEfficiency(dish, setKey);
                return { ...dish, opportunityCost, profit, efficiency };
            });

            // Sắp xếp theo hiệu suất (xét drop rate)
            dishProfits.sort((a, b) => b.efficiency - a.efficiency);

            // Greedy algorithm
            let remaining = { ...ingredients };
            let totalRevenue = 0;
            const strategy = [];

            for (const dish of dishProfits) {
                if (dish.profit <= 0) continue;

                let maxCook = Infinity;
                if (dish.food1 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food1 / dish.food1));
                if (dish.food2 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food2 / dish.food2));
                if (dish.food3 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food3 / dish.food3));

                if (maxCook > 0 && maxCook !== Infinity) {
                    const revenue = maxCook * dish.price;
                    const netProfit = maxCook * dish.profit;

                    remaining.food1 -= maxCook * dish.food1;
                    remaining.food2 -= maxCook * dish.food2;
                    remaining.food3 -= maxCook * dish.food3;
                    totalRevenue += revenue;

                    strategy.push({ dish, count: maxCook, revenue, netProfit });
                }
            }

            // Tính giá trị nguyên liệu dư
            const remainingValue = remaining.food1 * foodPrices.food1 +
                remaining.food2 * foodPrices.food2 +
                remaining.food3 * foodPrices.food3;

            const finalRevenue = totalRevenue + remainingValue;
            const profitIncrease = finalRevenue - totalRetail;
            const profitPercent = totalRetail > 0 ? (profitIncrease / totalRetail * 100) : 0;

            return {
                strategy,
                remaining,
                remainingValue,
                totalRevenue: totalRevenue,
                finalRevenue,
                totalRetail,
                profitIncrease,
                profitPercent
            };
        }

        // Tính toán cho 1000 food (dùng drop rate của từng set để so sánh)
        function calculate1000FoodStrategy() {
            const results = {};
            const TOTAL_FOOD = 1000;

            Object.keys(SETS).forEach(setKey => {
                // Lấy tỷ lệ rơi của set này
                const dropRate = setStates[setKey].foodDropRate;
                const totalRate = dropRate.food1 + dropRate.food2 + dropRate.food3;

                // Tính nguyên liệu theo tỷ lệ rơi của set (nếu tổng != 1, normalize)
                const normalizedRate = totalRate > 0 ? {
                    food1: dropRate.food1 / totalRate,
                    food2: dropRate.food2 / totalRate,
                    food3: dropRate.food3 / totalRate
                } : { food1: 0.65, food2: 0.25, food3: 0.10 };

                const ingredients = {
                    food1: Math.round(TOTAL_FOOD * normalizedRate.food1),
                    food2: Math.round(TOTAL_FOOD * normalizedRate.food2),
                    food3: Math.round(TOTAL_FOOD * normalizedRate.food3)
                };

                // Tính toán với drop rate
                const result = calculateSetStrategyWithDropRate(setKey, ingredients);

                results[setKey] = {
                    setName: SETS[setKey].name,
                    ingredients: ingredients, // Lưu lại số nguyên liệu đã dùng
                    dropRate: dropRate, // Lưu lại tỷ lệ rơi
                    finalRevenue: result.finalRevenue,
                    profitIncrease: result.profitIncrease,
                    profitPercent: result.profitPercent,
                    strategy: result.strategy
                };
            });

            return results;
        }

                </div>

                <div class="explanation-box" style="background: #fdf2f2; border-left-color: #dc3545;">
                    <h4 style="color: #dc3545;">📊 Hiệu Suất Món Ăn - Bạn cần biết</h4>
                    <p style="font-size: 0.9em; line-height: 1.6;">
                        <strong>Hiệu suất</strong> trong bảng món ăn được tính bằng <code>Lợi nhuận / Trọng số khan hiếm</code>.
                        <br>
                        - Món nào dùng nguyên liệu <strong>càng dễ kiếm (drop rate cao)</strong> mà vẫn có <strong>lợi nhuận tốt</strong> thì hiệu suất sẽ <strong>càng cao</strong>.
                        <br>
                        - Hãy ưu tiên nấu các món có hiệu suất cao nhất để không bị "kẹt" nguyên liệu hiếm!
                    </p>
                </div>
            `;

            document.getElementById('overallStrategy').innerHTML = overallHTML;
        }

        // Tính toán tất cả
        function calculateAll() {
            Object.keys(SETS).forEach(setKey => {
                renderDishTable(setKey);
                const result = calculateSetStrategy(setKey);
                displaySetStrategy(setKey, result);
            });
            displayComparison();
        }

        // Reset về mặc định
        function resetToDefault() {
            if (confirm('Bạn có chắc muốn reset tất cả về mặc định?')) {
                localStorage.removeItem('coo-king-multi-set-states');
                initializeStates();
                createTabContents();
                calculateAll();
                alert('Đã reset về mặc định! ✅');
            }
        }

        // Khởi tạo
        initializeStates();
        createTabs();
        createTabContents();
        calculateAll();
    </script>
</body>

</html>
