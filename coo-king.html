<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coo-king Calculator - Multi Set</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .section h2 {
            color: #764ba2;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: #e9ecef;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #dee2e6;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .input-group input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f1f3f5;
        }

        .profit-positive {
            color: #28a745;
            font-weight: 600;
        }

        .profit-negative {
            color: #dc3545;
            font-weight: 600;
        }

        .checkbox-cell {
            width: 50px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        input[type="number"].price-input {
            width: 100px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            text-align: center;
        }

        .strategy-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .strategy-section h2 {
            color: white;
            margin-bottom: 20px;
        }

        .strategy-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        .strategy-item h3 {
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .strategy-item p {
            margin: 5px 0;
            line-height: 1.6;
        }

        .total-box {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .total-box h3 {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .total-box .amount {
            font-size: 2.5em;
            font-weight: 700;
            color: #28a745;
        }

        .comparison {
            margin-top: 15px;
            font-size: 1.1em;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 5px;
        }

        .badge-best {
            background: #ffd700;
            color: #333;
        }

        .badge-good {
            background: #28a745;
            color: white;
        }

        .badge-bad {
            background: #dc3545;
            color: white;
        }

        .back-button, .reset-button {
            display: inline-block;
            padding: 10px 20px;
            background: #f8f9fa;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid #667eea;
            cursor: pointer;
            font-family: inherit;
        }

        .reset-button {
            color: #dc3545;
            border-color: #dc3545;
        }

        .back-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .reset-button:hover {
            background: #dc3545;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
        }

        .comparison-section {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .comparison-section h2 {
            color: white;
            margin-bottom: 20px;
        }

        .set-comparison {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .set-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .set-card.best {
            background: rgba(255, 215, 0, 0.3);
            border: 3px solid #ffd700;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍳 Coo-king Calculator - Multi Set</h1>
        <div style="text-align: center; margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="back-button">← Quay lại trang chủ</a>
            <button onclick="resetToDefault()" class="reset-button">🔄 Reset về mặc định</button>
        </div>

        <!-- Tabs cho các Set -->
        <div class="tabs" id="setTabs">
            <!-- Sẽ được tạo bằng JavaScript -->
        </div>

        <!-- Tab Contents -->
        <div id="tabContents">
            <!-- Sẽ được tạo bằng JavaScript -->
        </div>

        <!-- So sánh giữa các Set -->
        <div class="comparison-section">
            <h2>🏆 So Sánh Giữa Các Set</h2>
            <div id="setComparison">
                <!-- Sẽ được tạo bằng JavaScript -->
            </div>
        </div>

        <!-- Phân tích tổng thể -->
        <div class="strategy-section">
            <h2>💡 Phân Tích Chiến Lược Tối Ưu</h2>
            <div id="overallStrategy">
                <!-- Sẽ được tạo bằng JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Cấu trúc dữ liệu cho mỗi Set
        const SETS = {
            set1: {
                id: 'set1',
                name: 'Set 1 (Đảo Hề)',
                foodPrices: { food1: 29, food2: 86, food3: 156 },
                dishes: [
                    { id: 1, name: 'Sâu hồi', food1: 1, food2: 0, food3: 0, price: 20 },
                    { id: 2, name: 'Hamburger', food1: 3, food2: 0, food3: 0, price: 86 },
                    { id: 3, name: 'Pudding', food1: 2, food2: 1, food3: 0, price: 154 },
                    { id: 4, name: 'Salad', food1: 5, food2: 0, food3: 0, price: 192 },
                    { id: 5, name: 'Gumball', food1: 3, food2: 2, food3: 0, price: 288 },
                    { id: 6, name: 'Thần lằn', food1: 4, food2: 2, food3: 0, price: 364 },
                    { id: 7, name: 'Xương bò ma', food1: 6, food2: 3, food3: 0, price: 590 },
                    { id: 8, name: 'Súp đặc mắt nhện', food1: 5, food2: 2, food3: 1, price: 571 },
                    { id: 9, name: 'Phô mai giòi', food1: 10, food2: 6, food3: 0, price: 1258 },
                    { id: 10, name: 'Tinh linh máu', food1: 8, food2: 4, food3: 0, price: 844 },
                    { id: 11, name: 'Chân sư tử', food1: 8, food2: 5, food3: 3, price: 1008 },
                    { id: 12, name: 'Bánh quy pho mát', food1: 20, food2: 10, food3: 5, price: 2160 }
                ]
            },
            set2: {
                id: 'set2',
                name: 'Set 2 (Đảo Hải sản)',
                foodPrices: { food1: 36, food2: 108, food3: 195 },
                dishes: [
                    // THÊM CÁC MÓN ĂN SET 2 TẠI ĐÂY
                    { id: 1, name: 'Hàu nướng', food1: 1, food2: 0, food3: 0, price: 24 },
                    { id: 2, name: 'Bạch tuộc ngâm', food1: 3, food2: 0, food3: 0, price: 108 },
                    { id: 3, name: 'Shasimi cá đuối', food1: 5, food2: 0, food3: 0, price: 240 },
                    { id: 4, name: 'Tôm kỳ lạ', food1: 2, food2: 1, food3: 0, price: 192 },
                    { id: 5, name: 'Phô mai muối', food1: 4, food2: 2, food3: 0, price: 456 },
                    { id: 6, name: 'Thuỷ Long Nướng', food1: 6, food2: 3, food3: 0, price: 553 },
                    { id: 7, name: 'Cánh cá người', food1: 5, food2: 2, food3: 1, price: 420 },
                    { id: 8, name: 'Rắn biển', food1: 8, food2: 4, food3: 0, price: 633 },
                    { id: 9, name: 'Rồng biển xào', food1: 2, food2: 3, food3: 0, price: 360 },
                    { id: 10, name: 'Cá mập sừng ma', food1: 8, food2: 5, food3: 3, price: 1050 },
                    { id: 11, name: 'Món Set 2 - 11', food1: 8, food2: 5, food3: 3, price: 0 },
                    { id: 12, name: 'Món Set 2 - 12', food1: 20, food2: 10, food3: 5, price: 0 }
                ]
            }
            // Thêm set3, set4,... tại đây
        };

        // Tỷ lệ rơi nguyên liệu mặc định
        const DEFAULT_FOOD_DROP_RATE = {
            food1: 0.65,  // 65%
            food2: 0.25,  // 25%
            food3: 0.10   // 10%
        };

        // State cho mỗi set
        let setStates = {};
        let currentSet = 'set1';

        // Load từ localStorage
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('coo-king-multi-set-states');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    console.error('Lỗi khi load localStorage:', e);
                    return {};
                }
            }
            return {};
        }

        // Lưu vào localStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem('coo-king-multi-set-states', JSON.stringify(setStates));
            } catch (e) {
                console.error('Lỗi khi lưu localStorage:', e);
            }
        }

        // Khởi tạo state cho các set
        function initializeStates() {
            const savedStates = loadFromLocalStorage();
            
            Object.keys(SETS).forEach(setKey => {
                const set = SETS[setKey];
                const savedSetState = savedStates[setKey];
                
                setStates[setKey] = {
                    dishes: set.dishes.map(dish => {
                        if (savedSetState) {
                            const savedDish = savedSetState.dishes.find(d => d.id === dish.id);
                            if (savedDish) {
                                return {
                                    ...dish,
                                    enabled: savedDish.enabled !== undefined ? savedDish.enabled : true,
                                    price: savedDish.price !== undefined ? savedDish.price : dish.price
                                };
                            }
                        }
                        return { ...dish, enabled: true };
                    }),
                    ingredients: savedSetState?.ingredients || { food1: 650, food2: 250, food3: 100 },
                    foodDropRate: savedSetState?.foodDropRate || { ...DEFAULT_FOOD_DROP_RATE }
                };
            });
        }

        // Update food rates cho từng set
        function updateFoodRates(setKey) {
            const rate1 = parseFloat(document.getElementById(`${setKey}-rate1`).value) || 0;
            const rate2 = parseFloat(document.getElementById(`${setKey}-rate2`).value) || 0;
            const rate3 = parseFloat(document.getElementById(`${setKey}-rate3`).value) || 0;
            
            setStates[setKey].foodDropRate = {
                food1: rate1 / 100,
                food2: rate2 / 100,
                food3: rate3 / 100
            };
            
            // Cập nhật tổng và cảnh báo
            const total = rate1 + rate2 + rate3;
            document.getElementById(`${setKey}-totalRate`).textContent = total.toFixed(2);
            
            const warning = document.getElementById(`${setKey}-rateWarning`);
            if (Math.abs(total - 100) > 0.01) {
                warning.style.display = 'inline';
            } else {
                warning.style.display = 'none';
            }
            
            // Cập nhật label của nguyên liệu
            const set = SETS[setKey];
            document.getElementById(`${setKey}-food1-label`).textContent = 
                `Food 1 (${rate1.toFixed(0)}% - Giá lẻ: ${set.foodPrices.food1})`;
            document.getElementById(`${setKey}-food2-label`).textContent = 
                `Food 2 (${rate2.toFixed(0)}% - Giá lẻ: ${set.foodPrices.food2})`;
            document.getElementById(`${setKey}-food3-label`).textContent = 
                `Food 3 (${rate3.toFixed(0)}% - Giá lẻ: ${set.foodPrices.food3})`;
            
            saveToLocalStorage();
            renderDishTable(setKey);
            const result = calculateSetStrategy(setKey);
            displaySetStrategy(setKey, result);
            displayComparison();
        }

        // Tính chi phí cơ hội
        function calculateOpportunityCost(dish, setKey) {
            const foodPrices = SETS[setKey].foodPrices;
            return dish.food1 * foodPrices.food1 + 
                   dish.food2 * foodPrices.food2 + 
                   dish.food3 * foodPrices.food3;
        }

        // Đánh giá món ăn (dựa trên hiệu suất + lợi nhuận)
        function getRating(profit, efficiency = 0) {
            // Ưu tiên hiệu suất hơn lợi nhuận tuyệt đối
            if (efficiency >= 100 && profit >= 300) return '<span class="badge badge-best">⭐ XUẤT SẮC</span>';
            if (efficiency >= 60 || profit >= 200) return '<span class="badge badge-good">✓✓✓ Rất tốt</span>';
            if (efficiency >= 30 || profit >= 100) return '<span class="badge badge-good">✓✓ Tốt</span>';
            if (efficiency >= 10 || profit >= 20) return '<span class="badge badge-good">✓ Khá</span>';
            return '<span class="badge badge-bad">❌ Tệ</span>';
        }

        // Tạo tabs
        function createTabs() {
            const tabsContainer = document.getElementById('setTabs');
            tabsContainer.innerHTML = Object.keys(SETS).map((setKey, index) => 
                `<div class="tab ${index === 0 ? 'active' : ''}" onclick="switchTab('${setKey}')">
                    ${SETS[setKey].name}
                </div>`
            ).join('');
        }

        // Switch tab
        function switchTab(setKey) {
            currentSet = setKey;
            
            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update active content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`content-${setKey}`).classList.add('active');
        }

        // Tạo nội dung cho mỗi tab
        function createTabContents() {
            const container = document.getElementById('tabContents');
            container.innerHTML = Object.keys(SETS).map((setKey, index) => {
                const set = SETS[setKey];
                return `
                    <div id="content-${setKey}" class="tab-content ${index === 0 ? 'active' : ''}">
        <div class="section">
                            <h2>⚙️ Tỷ Lệ Rơi Nguyên Liệu</h2>
            <div class="input-grid">
                <div class="input-group">
                                    <label>Food 1 (%):</label>
                                    <input type="number" id="${setKey}-rate1" value="${(setStates[setKey].foodDropRate.food1 * 100).toFixed(2)}" 
                                           step="0.01" min="0" max="100" onchange="updateFoodRates('${setKey}')">
                </div>
                <div class="input-group">
                                    <label>Food 2 (%):</label>
                                    <input type="number" id="${setKey}-rate2" value="${(setStates[setKey].foodDropRate.food2 * 100).toFixed(2)}" 
                                           step="0.01" min="0" max="100" onchange="updateFoodRates('${setKey}')">
                </div>
                <div class="input-group">
                                    <label>Food 3 (%):</label>
                                    <input type="number" id="${setKey}-rate3" value="${(setStates[setKey].foodDropRate.food3 * 100).toFixed(2)}" 
                                           step="0.01" min="0" max="100" onchange="updateFoodRates('${setKey}')">
                </div>
            </div>
                            <div style="margin-top: 10px; color: #666; font-size: 0.9em;">
                                <strong>Tổng:</strong> <span id="${setKey}-totalRate">100.00</span>%
                                <span id="${setKey}-rateWarning" style="color: #ff6b6b; margin-left: 10px; display: none;">⚠️ Tổng tỷ lệ nên bằng 100%</span>
                            </div>
        </div>

        <div class="section">
                            <h2>📦 Nguyên Liệu ${set.name}</h2>
            <div class="input-grid">
                <div class="input-group">
                                    <label id="${setKey}-food1-label">Food 1 (${(setStates[setKey].foodDropRate.food1 * 100).toFixed(0)}% - Giá lẻ: ${set.foodPrices.food1})</label>
                                    <input type="number" id="${setKey}-food1" value="${setStates[setKey].ingredients.food1}" min="0" 
                                           onchange="updateIngredients('${setKey}')">
                </div>
                <div class="input-group">
                                    <label id="${setKey}-food2-label">Food 2 (${(setStates[setKey].foodDropRate.food2 * 100).toFixed(0)}% - Giá lẻ: ${set.foodPrices.food2})</label>
                                    <input type="number" id="${setKey}-food2" value="${setStates[setKey].ingredients.food2}" min="0"
                                           onchange="updateIngredients('${setKey}')">
                </div>
                <div class="input-group">
                                    <label id="${setKey}-food3-label">Food 3 (${(setStates[setKey].foodDropRate.food3 * 100).toFixed(0)}% - Giá lẻ: ${set.foodPrices.food3})</label>
                                    <input type="number" id="${setKey}-food3" value="${setStates[setKey].ingredients.food3}" min="0"
                                           onchange="updateIngredients('${setKey}')">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>🍽️ Danh Sách Món Ăn</h2>
                            <p style="text-align: center; color: #666; font-size: 0.9em; margin-bottom: 10px;">
                                💾 Trạng thái checkbox và giá bán được tự động lưu
                            </p>
                            <p style="text-align: center; color: #17a2b8; font-size: 0.85em; margin-bottom: 10px;">
                                ℹ️ <strong>Hiệu suất</strong> = Lợi nhuận ÷ Trọng số nguyên liệu (xét tỷ lệ rơi đã cài đặt). Dùng để so sánh món ăn!
                            </p>
            <div class="table-container">
                                <table>
                    <thead>
                        <tr>
                            <th>Chọn</th>
                            <th>STT</th>
                            <th>Tên món</th>
                            <th>Food1</th>
                            <th>Food2</th>
                            <th>Food3</th>
                            <th>Giá bán</th>
                            <th>Chi phí cơ hội</th>
                            <th>Lợi nhuận</th>
                                            <th>Hiệu suất</th>
                            <th>Đánh giá</th>
                        </tr>
                    </thead>
                                    <tbody id="${setKey}-table-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="strategy-section">
                            <h2>💡 Chiến Lược ${set.name}</h2>
                            <div id="${setKey}-strategy">
            </div>
        </div>
    </div>
                `;
            }).join('');
        }

        // Render bảng món ăn cho 1 set
        function renderDishTable(setKey) {
            const tbody = document.getElementById(`${setKey}-table-body`);
            const dishes = setStates[setKey].dishes;
            
            tbody.innerHTML = dishes.map(dish => {
                const opportunityCost = calculateOpportunityCost(dish, setKey);
                const { profit, efficiency } = calculateDishEfficiency(dish, setKey);
                const rating = getRating(profit, efficiency);
                
                // Màu sắc cho hiệu suất
                let efficiencyColor = '#666';
                if (efficiency >= 100) efficiencyColor = '#ffd700'; // Vàng - Xuất sắc
                else if (efficiency >= 60) efficiencyColor = '#28a745'; // Xanh - Tốt
                else if (efficiency >= 30) efficiencyColor = '#17a2b8'; // Xanh dương - Khá
                else if (efficiency < 0) efficiencyColor = '#dc3545'; // Đỏ - Tệ
                
                return `
                    <tr>
                    <td class="checkbox-cell">
                            <input type="checkbox" ${dish.enabled ? 'checked' : ''} 
                                   onchange="toggleDish('${setKey}', ${dish.id})">
                    </td>
                    <td>${dish.id}</td>
                    <td><strong>${dish.name}</strong></td>
                    <td>${dish.food1}</td>
                    <td>${dish.food2}</td>
                    <td>${dish.food3}</td>
                    <td>
                            <input type="number" class="price-input" value="${dish.price}" min="0" 
                                   onchange="updatePrice('${setKey}', ${dish.id}, this.value)">
                    </td>
                    <td>${opportunityCost.toFixed(0)}</td>
                    <td class="${profit >= 0 ? 'profit-positive' : 'profit-negative'}">
                        ${profit >= 0 ? '+' : ''}${profit.toFixed(0)}
                    </td>
                        <td style="color: ${efficiencyColor}; font-weight: 600;">
                            ${efficiency.toFixed(1)}
                        </td>
                    <td>${rating}</td>
                    </tr>
                `;
            }).join('');
        }

        // Toggle món ăn
        function toggleDish(setKey, dishId) {
            const dish = setStates[setKey].dishes.find(d => d.id === dishId);
            dish.enabled = !dish.enabled;
            saveToLocalStorage();
            calculateAll();
        }

        // Cập nhật giá
        function updatePrice(setKey, dishId, newPrice) {
            const dish = setStates[setKey].dishes.find(d => d.id === dishId);
            dish.price = parseFloat(newPrice) || 0;
            saveToLocalStorage();

        // Cập nhật nguyên liệu
        function updateIngredients(setKey) {
            setStates[setKey].ingredients = {
                food1: parseInt(document.getElementById(`${setKey}-food1`).value) || 0,
                food2: parseInt(document.getElementById(`${setKey}-food2`).value) || 0,

            };
            saveToLocalStorage();
            calculateAll();
        }

        // Tính hiệu suất món ăn (xét tỷ lệ rơi nguyên liệu)
        function calculateDishEfficiency(dish, setKey) {
            const opportunityCost = calculateOpportunityCost(dish, setKey);
            const profit = dish.price - opportunityCost;
            
            // Lấy tỷ lệ rơi của set này
            const dropRate = setStates[setKey].foodDropRate;
            
            // Trọng số khan hiếm dựa trên tỷ lệ rơi (số càng cao = càng khan hiếm)
            // Nếu tỷ lệ rơi = 0, chỉ tính trọng số nếu món cần loại nguyên liệu đó
            // Nếu món không cần loại đó (dish.foodX = 0), trọng số = 0 để không ảnh hưởng
            const getWeight = (rate, needed) => {
                if (rate <= 0) {
                    // Nếu tỷ lệ rơi = 0 và món cần nguyên liệu này -> Infinity (không thể nấu)
                    // Nếu tỷ lệ rơi = 0 nhưng món không cần -> 0 (không ảnh hưởng)
                    return needed > 0 ? Infinity : 0;
                }
                return 1 / rate;
            };
            
            const scarcityWeights = {
                food1: getWeight(dropRate.food1, dish.food1),
                food2: getWeight(dropRate.food2, dish.food2),
                food3: getWeight(dropRate.food3, dish.food3)
            };
            
            // Tổng chi phí có trọng số (weighted cost)
            const weightedCost = 
                dish.food1 * scarcityWeights.food1 + 
                dish.food2 * scarcityWeights.food2 + 
                dish.food3 * scarcityWeights.food3;
            
            // Hiệu suất = Lợi nhuận / Chi phí có trọng số
            // Món nào hiệu suất cao = tận dụng nguyên liệu tốt hơn
            // Nếu weightedCost = Infinity (cần nguyên liệu không rơi) -> hiệu suất = 0
            const efficiency = (weightedCost > 0 && isFinite(weightedCost)) ? profit / weightedCost : 0;
            
            return { profit, efficiency, weightedCost };
        }

        // Tính hiệu suất đơn giản dựa trên số lượng nguyên liệu (không dùng drop rate)
        function calculateSimpleEfficiency(dish, setKey) {
            const opportunityCost = calculateOpportunityCost(dish, setKey);
            const profit = dish.price - opportunityCost;
            
            // Hiệu suất đơn giản = lợi nhuận / tổng số nguyên liệu cần
            const totalIngredients = dish.food1 + dish.food2 + dish.food3;
            const efficiency = totalIngredients > 0 ? profit / totalIngredients : 0;
            
            return { profit, efficiency };
        }

        // Tính toán chiến lược cho 1 set (dựa trên nguyên liệu hiện tại)
        function calculateSetStrategy(setKey) {
            const ingredients = setStates[setKey].ingredients;
            const foodPrices = SETS[setKey].foodPrices;
            const enabledDishes = setStates[setKey].dishes.filter(d => d.enabled);

            // Tính tổng giá bán lẻ
            const totalRetail = ingredients.food1 * foodPrices.food1 + 
                               ingredients.food2 * foodPrices.food2 + 
                               ingredients.food3 * foodPrices.food3;

            // Tính lợi nhuận và hiệu suất đơn giản cho mỗi món
            const dishProfits = enabledDishes.map(dish => {
                const opportunityCost = calculateOpportunityCost(dish, setKey);
                const { profit, efficiency } = calculateSimpleEfficiency(dish, setKey);
                return { ...dish, opportunityCost, profit, efficiency };
            });

            // Sắp xếp theo lợi nhuận/nguyên liệu (hiệu suất đơn giản)
            dishProfits.sort((a, b) => b.efficiency - a.efficiency);

            // Greedy algorithm
            let remaining = { ...ingredients };
            let totalRevenue = 0;
            const strategy = [];

            for (const dish of dishProfits) {
                if (dish.profit <= 0) continue;

                let maxCook = Infinity;
                if (dish.food1 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food1 / dish.food1));
                if (dish.food2 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food2 / dish.food2));
                if (dish.food3 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food3 / dish.food3));

                if (maxCook > 0 && maxCook !== Infinity) {
                    const revenue = maxCook * dish.price;
                    const netProfit = maxCook * dish.profit;

                    remaining.food1 -= maxCook * dish.food1;
                    remaining.food2 -= maxCook * dish.food2;
                    remaining.food3 -= maxCook * dish.food3;
                    totalRevenue += revenue;

                    strategy.push({ dish, count: maxCook, revenue, netProfit });
                }
            }

            // Tính giá trị nguyên liệu dư
            const remainingValue = remaining.food1 * foodPrices.food1 +
                                  remaining.food2 * foodPrices.food2 +
                                  remaining.food3 * foodPrices.food3;

            const finalRevenue = totalRevenue + remainingValue;
            const profitIncrease = finalRevenue - totalRetail;
            const profitPercent = totalRetail > 0 ? (profitIncrease / totalRetail * 100) : 0;

            return {
                strategy,
                remaining,
                remainingValue,
                totalRevenue: totalRevenue,
                finalRevenue,
                totalRetail,
                profitIncrease,
                profitPercent
            };
        }

        // Tính toán chiến lược dựa trên drop rate (cho so sánh giữa các set)
        function calculateSetStrategyWithDropRate(setKey, ingredients) {
            const foodPrices = SETS[setKey].foodPrices;
            const enabledDishes = setStates[setKey].dishes.filter(d => d.enabled);

            // Tính tổng giá bán lẻ
            const totalRetail = ingredients.food1 * foodPrices.food1 + 
                               ingredients.food2 * foodPrices.food2 + 
                               ingredients.food3 * foodPrices.food3;

            // Tính lợi nhuận và hiệu suất (dùng drop rate) cho mỗi món
            const dishProfits = enabledDishes.map(dish => {
                const opportunityCost = calculateOpportunityCost(dish, setKey);
                const { profit, efficiency } = calculateDishEfficiency(dish, setKey);
                return { ...dish, opportunityCost, profit, efficiency };
            });

            // Sắp xếp theo hiệu suất (xét drop rate)
            dishProfits.sort((a, b) => b.efficiency - a.efficiency);

            // Greedy algorithm
            let remaining = { ...ingredients };
            let totalRevenue = 0;
            const strategy = [];

            for (const dish of dishProfits) {
                if (dish.profit <= 0) continue;

                let maxCook = Infinity;
                if (dish.food1 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food1 / dish.food1));
                if (dish.food2 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food2 / dish.food2));
                if (dish.food3 > 0) maxCook = Math.min(maxCook, Math.floor(remaining.food3 / dish.food3));

                if (maxCook > 0 && maxCook !== Infinity) {
                    const revenue = maxCook * dish.price;
                    const netProfit = maxCook * dish.profit;

                    remaining.food1 -= maxCook * dish.food1;
                    remaining.food2 -= maxCook * dish.food2;
                    remaining.food3 -= maxCook * dish.food3;
                    totalRevenue += revenue;

                    strategy.push({ dish, count: maxCook, revenue, netProfit });
                }
            }

            // Tính giá trị nguyên liệu dư
            const remainingValue = remaining.food1 * foodPrices.food1 +
                                  remaining.food2 * foodPrices.food2 +
                                  remaining.food3 * foodPrices.food3;

            const finalRevenue = totalRevenue + remainingValue;
            const profitIncrease = finalRevenue - totalRetail;
            const profitPercent = totalRetail > 0 ? (profitIncrease / totalRetail * 100) : 0;

            return {
                strategy,
                remaining,
                remainingValue,
                totalRevenue: totalRevenue,
                finalRevenue,
                totalRetail,
                profitIncrease,
                profitPercent
            };
        }

        // Tính toán cho 1000 food (dùng drop rate của từng set để so sánh)
        function calculate1000FoodStrategy() {
            const results = {};
            const TOTAL_FOOD = 1000;
            
            Object.keys(SETS).forEach(setKey => {
                // Lấy tỷ lệ rơi của set này
                const dropRate = setStates[setKey].foodDropRate;
                const totalRate = dropRate.food1 + dropRate.food2 + dropRate.food3;
                
                // Tính nguyên liệu theo tỷ lệ rơi của set (nếu tổng != 1, normalize)
                const normalizedRate = totalRate > 0 ? {
                    food1: dropRate.food1 / totalRate,
                    food2: dropRate.food2 / totalRate,
                    food3: dropRate.food3 / totalRate
                } : { food1: 0.65, food2: 0.25, food3: 0.10 };
                
                const ingredients = {
                    food1: Math.round(TOTAL_FOOD * normalizedRate.food1),
                    food2: Math.round(TOTAL_FOOD * normalizedRate.food2),
                    food3: Math.round(TOTAL_FOOD * normalizedRate.food3)
                };
                
                // Tính toán với drop rate
                const result = calculateSetStrategyWithDropRate(setKey, ingredients);
                
                results[setKey] = {
                    setName: SETS[setKey].name,
                    ingredients: ingredients, // Lưu lại số nguyên liệu đã dùng
                    dropRate: dropRate, // Lưu lại tỷ lệ rơi
                    finalRevenue: result.finalRevenue,
                    profitIncrease: result.profitIncrease,
                    profitPercent: result.profitPercent,
                    strategy: result.strategy
                };
            });
            
            return results;
        }

                        • <strong>Hàu nướng</strong>: Lợi nhuận -12, cần 1-0-0 → Hiệu suất = -12 ÷ (1×1.11) = <strong>-10.8</strong> ❌<br>
                        • <strong>Shasimi cá đuối</strong>: Lợi nhuận 60, cần 5-0-0 → Hiệu suất = 60 ÷ (5×1.11) = <strong>10.8</strong> ✓<br>
                        • <strong>Cánh cá người</strong>: Cần Food3 nhưng tỷ lệ rơi = 0% → Hiệu suất = <strong>0</strong> (không nấu được)
                    </p>
                    <p style="margin-top: 10px; color: #ffd700;">
                        → Ưu tiên món <strong>không cần nguyên liệu hiếm</strong> và có <strong>hiệu suất cao</strong>!
                    </p>
                </div>
                
                <div class="strategy-item">
                    <h3>📊 Bảng So Sánh Toàn Bộ Các Set</h3>
                    <table style="width: 100%; margin-top: 15px; border-collapse: collapse;">
                        <thead>
                            <tr style="background: rgba(255,255,255,0.1);">
                                <th style="padding: 10px; text-align: left;">Set</th>
                                <th style="padding: 10px; text-align: right;">Thu Nhập</th>
                                <th style="padding: 10px; text-align: right;">Lợi Nhuận</th>
                                <th style="padding: 10px; text-align: right;">Chênh Lệch</th>
                                <th style="padding: 10px; text-align: center;">Xếp Hạng</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.keys(results1000)
                                .sort((a, b) => results1000[b].finalRevenue - results1000[a].finalRevenue)
                                .map((setKey, index) => {
                                    const result = results1000[setKey];
                                    const diff = result.finalRevenue - results1000[bestSet].finalRevenue;
                                    const isBest = setKey === bestSet;
                                    return `
                                        <tr style="background: ${isBest ? 'rgba(255, 215, 0, 0.2)' : 'transparent'};">
                                            <td style="padding: 10px; font-weight: 600;">
                                                ${isBest ? '🏆 ' : ''}${result.setName}
                                            </td>
                                            <td style="padding: 10px; text-align: right; font-weight: 600;">
                                                ${result.finalRevenue.toFixed(0)}
                                            </td>
                                            <td style="padding: 10px; text-align: right; color: ${result.profitIncrease >= 0 ? '#90EE90' : '#FF6B6B'};">
                                                ${result.profitIncrease >= 0 ? '+' : ''}${result.profitIncrease.toFixed(0)}
                                                (${result.profitPercent.toFixed(1)}%)
                                            </td>
                                            <td style="padding: 10px; text-align: right; color: ${isBest ? '#FFD700' : '#FF6B6B'}; font-weight: 600;">
                                                ${isBest ? '—' : diff.toFixed(0)}
                                            </td>
                                            <td style="padding: 10px; text-align: center; font-size: 1.2em;">
                                                ${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : ''}
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            document.getElementById('overallStrategy').innerHTML = overallHTML;
        }

        // Tính toán tất cả
        function calculateAll() {
            Object.keys(SETS).forEach(setKey => {
                renderDishTable(setKey);
                const result = calculateSetStrategy(setKey);
                displaySetStrategy(setKey, result);
            });
            displayComparison();
        }

        // Reset về mặc định
        function resetToDefault() {
            if (confirm('Bạn có chắc muốn reset tất cả về mặc định?')) {
                localStorage.removeItem('coo-king-multi-set-states');
                initializeStates();
                createTabContents();
                calculateAll();
                alert('Đã reset về mặc định! ✅');
            }
        }

        // Khởi tạo
        initializeStates();
        createTabs();
        createTabContents();
        calculateAll();
    </script>
</body>
</html>
