<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo Tàng</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Crimson+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Pro', 'Noto Serif', Georgia, serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8d5b7;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(139, 90, 43, 0.3) 0%, rgba(79, 55, 48, 0.4) 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .header h1 {
            font-size: 2.8em;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.2em;
            color: #c4a77d;
            position: relative;
            z-index: 1;
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .nav-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #8b5a2b 0%, #4f3730 100%);
            border: 2px solid #d4af37;
            border-radius: 12px;
            color: #e8d5b7;
            font-family: inherit;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, #a0522d 0%, #5d4037 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }


        /* Main Layout with Sidebar */
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 400px;
            gap: 25px;
        }

        @media (max-width: 1400px) {
            .main-layout {
                grid-template-columns: 250px 1fr 350px;
            }
        }

        @media (max-width: 1100px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Left Sidebar */
        .left-sidebar {
            background: rgba(26, 26, 46, 0.8);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 25px;
        }

        .sidebar-title {
            font-size: 0.85em;
            color: #c4a77d;
            margin-bottom: 10px;
            text-align: center;
        }

        .sidebar-total-points {
            font-size: 2.5em;
            font-weight: 700;
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .sidebar-reset-btn {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: 2px solid #dc3545;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .sidebar-reset-btn:hover {
            background: linear-gradient(135deg, #c82333 0%, #bd2130 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }

        .museum-list {
            list-style: none;
        }

        .museum-item {
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(139, 90, 43, 0.2);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: 600;
            color: #c4a77d;
        }

        .museum-item:hover {
            background: rgba(139, 90, 43, 0.4);
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateX(5px);
        }

        .museum-item.active {
            background: linear-gradient(135deg, #8b5a2b 0%, #4f3730 100%);
            border-color: #d4af37;
            color: #d4af37;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* Tree Container */
        .tree-container {
            background: rgba(26, 26, 46, 0.8);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: auto;
            min-height: 800px;
        }

        .tree-title {
            text-align: center;
            color: #d4af37;
            font-size: 1.5em;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
        }

        /* Tree SVG & Nodes */
        .tree-wrapper {
            position: relative;
            width: 100%;
            min-height: 1200px;
            padding: 20px 0;
        }

        .tree-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .tree-nodes {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 1200px;
        }

        .node {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            font-size: 1.3em;
            border: 4px solid;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transform: translateX(-50%);
        }

        .node:hover {
            transform: translateX(-50%) scale(1.15);
            z-index: 10;
        }

        .node.selected {
            transform: translateX(-50%) scale(1.2);
            z-index: 10;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
        }

        /* Node States */
        .node.locked {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border-color: #444;
            color: #666;
        }

        .node.available {
            background: linear-gradient(135deg, #1e5128 0%, #0f3d0f 100%);
            border-color: #4ade80;
            color: #4ade80;
            animation: pulse-available 2s infinite;
        }

        @keyframes pulse-available {

            0%,
            100% {
                box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4);
            }

            50% {
                box-shadow: 0 4px 25px rgba(74, 222, 128, 0.7);
            }
        }

        .node.in-progress {
            background: linear-gradient(135deg, #7c4a03 0%, #5c3503 100%);
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .node.completed {
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            border-color: #38bdf8;
            color: #fff;
        }

        .node.maxed {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%) !important;
            border-color: #86efac !important;
            color: #1a1a2e !important;
        }

        /* Special nodes (between columns) */
        .node.special-node {
            border-style: dashed;
        }

        .node.empty-node {
            font-size: 1.6em;
        }

        .node.empty-node.in-progress {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%) !important;
            border-color: #fcd34d !important;
            color: #1a1a2e !important;
        }

        .node.empty-node.maxed {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%) !important;
            border-color: #86efac !important;
            color: #1a1a2e !important;
        }

        /* Node Progress Ring */
        .node-progress {
            position: absolute;
            width: 80px;
            height: 80px;
            top: -5px;
            left: -5px;
            pointer-events: none;
        }

        /* Detail Panel */
        .detail-panel {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .detail-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
        }

        .detail-header h2 {
            color: #d4af37;
            font-size: 1.6em;
            margin-bottom: 5px;
        }

        .detail-header .node-id {
            background: linear-gradient(135deg, #8b5a2b 0%, #4f3730 100%);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .milestone-list {
            margin-bottom: 25px;
        }

        .milestone-item {
            background: rgba(139, 90, 43, 0.15);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .milestone-item.current {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.15);
        }

        .milestone-item.completed {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .milestone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .milestone-level {
            font-weight: 700;
            color: #d4af37;
        }

        .milestone-points {
            background: rgba(212, 175, 55, 0.2);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            color: #e8d5b7;
        }

        .milestone-points.completed {
            background: rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        .milestone-effects {
            font-size: 0.95em;
            line-height: 1.6;
            color: #c4a77d;
        }

        .milestone-effects li {
            margin-bottom: 5px;
            padding-left: 5px;
        }

        .effect-positive {
            color: #4ade80;
        }

        .effect-special {
            color: #f472b6;
        }

        .effect-unlock {
            color: #38bdf8;
        }

        /* Progress Input */
        .progress-section {
            background: rgba(139, 90, 43, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .progress-section h3 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .progress-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .progress-input {
            flex: 1;
            padding: 12px 15px;
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            color: #e8d5b7;
            font-size: 1.1em;
            font-family: inherit;
        }

        .progress-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .progress-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #8b5a2b 0%, #4f3730 100%);
            border: 2px solid #d4af37;
            border-radius: 10px;
            color: #d4af37;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .progress-btn:hover {
            background: linear-gradient(135deg, #a0522d 0%, #5d4037 100%);
        }

        .quick-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 8px 14px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #c4a77d;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .quick-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }


        /* Connection Lines */
        .tree-line {
            stroke: rgba(212, 175, 55, 0.7);
            stroke-width: 4;
            fill: none;
        }

        .tree-line.completed {
            stroke: #4ade80;
            stroke-width: 5;
        }

        .tree-line.active {
            stroke: #fbbf24;
            stroke-width: 5;
            stroke-dasharray: 8 4;
            animation: dash 1s linear infinite;
        }

        .tree-line.special-line {
            stroke-dasharray: 5 3;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -12;
            }
        }


        /* No Selection State */
        .no-selection {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .no-selection-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .node {
                width: 55px;
                height: 55px;
                font-size: 1.1em;
            }

            .left-sidebar {
                position: static;
                max-height: none;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(26, 26, 46, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.5);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ Bảo Tàng</h1>
        </div>

        <div class="nav-buttons">
            <a href="/" class="nav-btn">← Trang Chủ</a>
            <a href="/coo-king.html" class="nav-btn">🍳 Coo-king</a>
        </div>

        <div class="main-layout">
            <!-- Left Sidebar -->
            <div class="left-sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">Tổng Điểm Cần Dùng</div>
                    <div class="sidebar-total-points" id="totalPointsAllMaps">0</div>
                </div>

                <button class="sidebar-reset-btn" onclick="resetAllNodes()">
                    🔄 Reset Toàn Bộ Node
                </button>

                <div class="sidebar-section">
                    <div class="sidebar-title">Danh Sách Bảo Tàng</div>
                    <ul class="museum-list" id="museumList">
                        <!-- Generated by JS -->
                    </ul>
                </div>
            </div>

            <!-- Tree View -->
            <div class="tree-container">
                <div class="tree-title" id="mapTitle">Bảo tàng Cao Liên</div>

                <div class="tree-wrapper" id="treeWrapper">
                    <svg class="tree-svg" id="treeSvg"></svg>
                    <div class="tree-nodes" id="treeNodes">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Detail Panel -->
            <div class="detail-panel" id="detailPanel">
                <div class="no-selection">
                    <div class="no-selection-icon">🏛️</div>
                    <p>Chọn một node trên cây để xem chi tiết</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Museum Data Structure - Row-based layout

        // Special positions: LEFT-MID (37%), MID-RIGHT (63%)

        // State Management
        let currentMap = loadCurrentMap();
        let selectedNode = null;
        let progress = loadProgress();

        function loadCurrentMap() {
            const saved = localStorage.getItem('museum-current-map');
            return saved || 'caoLien';
        }

        function saveCurrentMap(mapId) {
            localStorage.setItem('museum-current-map', mapId);
        }

        function loadProgress() {
            const saved = localStorage.getItem('museum-progress');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    console.error('Error loading progress:', e);
                }
            }
            return {
                caoLien: {
                    currentPoints: 4500,
                    maxPoints: 20000,
                    nodes: {}
                }
            };
        }

        function saveProgress() {
            localStorage.setItem('museum-progress', JSON.stringify(progress));
        }

        function getNodeProgress(mapId, nodeId) {
            if (!progress[mapId]) progress[mapId] = { currentPoints: 0, maxPoints: 20000, nodes: {} };
            if (!progress[mapId].nodes[nodeId]) progress[mapId].nodes[nodeId] = { currentLevel: 0 };
            return progress[mapId].nodes[nodeId];
        }

        function setNodeProgress(mapId, nodeId, level) {
            if (!progress[mapId]) progress[mapId] = { currentPoints: 0, maxPoints: 20000, nodes: {} };
            progress[mapId].nodes[nodeId] = { currentLevel: level };
            saveProgress();
            renderTree();
            updateStats();
            if (selectedNode === nodeId) {
                showNodeDetail(nodeId);
            }
        }

        function getNodeState(mapId, nodeId) {
            const museum = MUSEUMS[mapId];
            const node = museum.nodes[nodeId];
            const nodeProgress = getNodeProgress(mapId, nodeId);
            const totalMilestones = node.milestones.length;

            // Check if all requirements are met
            const requirementsMet = node.requires.every(reqId => {
                const reqProgress = getNodeProgress(mapId, reqId);
                const reqNode = museum.nodes[reqId];
                return reqProgress.currentLevel >= reqNode.milestones.length;
            });

            if (nodeProgress.currentLevel >= totalMilestones) {
                return 'maxed';
            } else if (nodeProgress.currentLevel > 0) {
                return 'in-progress';
            } else if (requirementsMet || node.requires.length === 0) {
                return 'available';
            } else {
                return 'locked';
            }
        }

        // Rendering Functions
        function renderMuseumList() {
            const container = document.getElementById('museumList');
            container.innerHTML = Object.keys(MUSEUMS).map(mapId => {
                const museum = MUSEUMS[mapId];
                return `
                    <li class="museum-item ${mapId === currentMap ? 'active' : ''}" 
                        onclick="switchMap('${mapId}')">
                        🏛️ ${museum.name}
                    </li>
                `;
            }).join('');
        }

        function switchMap(mapId) {
            currentMap = mapId;
            saveCurrentMap(mapId);
            selectedNode = null;
            renderMuseumList();
            renderTree();
            updateStats();
            document.getElementById('mapTitle').textContent = `Bảo tàng ${MUSEUMS[mapId].name}`;
            document.getElementById('detailPanel').innerHTML = `
                <div class="no-selection">
                    <div class="no-selection-icon">🏛️</div>
                    <p>Chọn một node trên cây để xem chi tiết</p>
                </div>
            `;
        }

        function renderTree() {
            const museum = MUSEUMS[currentMap];
            const nodesContainer = document.getElementById('treeNodes');
            const wrapper = document.getElementById('treeWrapper');

            // Calculate wrapper dimensions
            const wrapperWidth = wrapper.offsetWidth || 600;
            const nodeSize = 60;
            const nodeRadius = nodeSize / 2;

            // Render nodes
            nodesContainer.innerHTML = Object.values(museum.nodes).map(node => {
                const nodeProgress = getNodeProgress(currentMap, node.id);
                const isSelected = selectedNode === node.id;
                const totalMilestones = node.milestones.length;

                // Determine node state for coloring
                let nodeClass = 'locked'; // Default: dark/locked
                if (nodeProgress.currentLevel > 0 && nodeProgress.currentLevel < totalMilestones) {
                    nodeClass = 'in-progress'; // Partial: yellow
                } else if (nodeProgress.currentLevel >= totalMilestones) {
                    nodeClass = 'maxed'; // Complete: gold
                }

                // Calculate position based on row and col
                const x = (node.col / 100) * wrapperWidth;
                const y = node.row * ROW_HEIGHT + 20;

                // Special styling for empty node
                const isEmptyNode = node.isEmpty === true;
                const specialClass = node.isSpecial ? 'special-node' : '';
                const displayId = isEmptyNode ? '☯' : node.id;
                const nodeIdStr = typeof node.id === 'string' ? `'${node.id}'` : node.id;

                // Add red color styling if isOne is true
                const textStyle = node.isOne ? 'color: #ef4444;' : '';

                return `
                    <div class="node ${nodeClass} ${isSelected ? 'selected' : ''} ${specialClass} ${isEmptyNode ? 'empty-node' : ''}"
                         style="left: ${x}px; top: ${y}px; ${textStyle}"
                         onclick="selectNode(${nodeIdStr})"
                         data-id="${node.id}"
                         title="${node.name} [${node.colName}]">
                        ${displayId}
                    </div>
                `;
            }).join('');

            // Render connections after nodes are rendered
            setTimeout(renderConnections, 10);
        }

        function renderConnections() {
            const museum = MUSEUMS[currentMap];
            const svgContainer = document.getElementById('treeSvg');
            const wrapper = document.getElementById('treeWrapper');
            const wrapperWidth = wrapper.offsetWidth || 600;
            const nodeRadius = 30;

            let svgContent = '';

            museum.connections.forEach(([fromId, toId]) => {
                const fromNode = museum.nodes[fromId];
                const toNode = museum.nodes[toId];

                if (!fromNode || !toNode) return;

                // Calculate positions
                const x1 = (fromNode.col / 100) * wrapperWidth;
                const y1 = fromNode.row * ROW_HEIGHT + 20 + nodeRadius;
                const x2 = (toNode.col / 100) * wrapperWidth;
                const y2 = toNode.row * ROW_HEIGHT + 20 + nodeRadius;

                // Always use default line class, no coloring
                let lineClass = 'tree-line';

                // Special dashed line for special nodes
                if (toNode.isSpecial) {
                    lineClass += ' special-line';
                }

                svgContent += `<line class="${lineClass}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
            });

            svgContainer.innerHTML = svgContent;
        }

        function selectNode(nodeId) {
            // Handle both string and number node IDs
            selectedNode = nodeId;
            renderTree();
            showNodeDetail(nodeId);
        }

        function showNodeDetail(nodeId) {
            const museum = MUSEUMS[currentMap];
            const node = museum.nodes[nodeId];
            const nodeProgress = getNodeProgress(currentMap, nodeId);
            const state = getNodeState(currentMap, nodeId);

            const panel = document.getElementById('detailPanel');

            // Check if this is the empty/special node
            const isEmptyNode = node.isEmpty === true;
            const isSpecialNode = node.isSpecial === true;
            const displayId = isEmptyNode ? '☯' : node.id;
            const nodeIdArg = typeof nodeId === 'string' ? `'${nodeId}'` : nodeId;

            let requirementsHTML = '';
            if (node.requires.length > 0) {
                requirementsHTML = `
                    <div style="margin-bottom: 15px; padding: 10px; background: rgba(139, 90, 43, 0.2); border-radius: 8px;">
                        <strong style="color: #d4af37;">Yêu cầu:</strong>
                        <ul style="margin-top: 8px; list-style: none;">
                            ${node.requires.map(reqId => {
                    const reqNode = museum.nodes[reqId];
                    const reqState = getNodeState(currentMap, reqId);
                    const isComplete = reqState === 'maxed';
                    const reqDisplayId = reqNode.isEmpty ? '☯' : reqId;
                    return `
                                    <li style="margin: 5px 0; color: ${isComplete ? '#4ade80' : '#ff6b6b'};">
                                        ${isComplete ? '✓' : '✗'} Node ${reqDisplayId}: ${reqNode.name}
                                    </li>
                                `;
                }).join('')}
                        </ul>
                    </div>
                `;
            }

            const milestonesHTML = node.milestones.map((milestone, index) => {
                const isCompleted = nodeProgress.currentLevel > index;
                const isCurrent = nodeProgress.currentLevel === index;

                return `
                    <div class="milestone-item ${isCompleted ? 'completed' : ''} ${isCurrent ? 'current' : ''}">
                        <div class="milestone-header">
                            <span class="milestone-level">
                                ${isCompleted ? '✓' : isCurrent ? '→' : '○'} Mốc ${milestone.level}
                            </span>
                            <span class="milestone-points ${isCompleted ? 'completed' : ''}">
                                ${milestone.points} điểm
                            </span>
                        </div>
                        <ul class="milestone-effects">
                            ${milestone.effects.map(effect => {
                    let effectClass = 'effect-positive';
                    // if (effect.includes('+')) effectClass = 'effect-positive';
                    // else if (effect.includes('Mở khóa')) effectClass = 'effect-unlock';
                    // else if (effect.includes('Nhận')) effectClass = 'effect-special';
                    // else if (effect.includes('%')) effectClass = 'effect-positive';
                    return `<li class="${effectClass}">${effect}</li>`;
                }).join('')}
                        </ul>
                    </div>
                `;
            }).join('');

            // Calculate total points spent on this node
            let pointsSpent = 0;
            for (let i = 0; i < nodeProgress.currentLevel; i++) {
                pointsSpent += node.milestones[i].points;
            }

            // Column info
            const colInfo = node.colName ? `<span style="font-size: 0.8em; color: #888;">[Cột: ${node.colName}]</span>` : '';

            panel.innerHTML = `
                <div class="detail-header">
                    <h2>${isEmptyNode ? '☯ ' : ''}${node.name}</h2>
                    <span class="node-id">${isEmptyNode ? 'Node Đặc Biệt' : `Node ${displayId}`} ${colInfo}</span>
                    ${isSpecialNode ? '<div style="margin-top: 5px; font-size: 0.85em; color: #f472b6;">✨ Node nhánh đặc biệt</div>' : ''}
                    <div style="margin-top: 10px; color: ${state === 'maxed' ? '#d4af37' :
                    state === 'completed' ? '#38bdf8' :
                        state === 'in-progress' ? '#fbbf24' :
                            state === 'available' ? '#4ade80' : '#666'
                };">
                        ${state === 'maxed' ? '⭐ ĐÃ MAX' :
                    state === 'in-progress' ? '🔄 ĐANG NÂNG' :
                        state === 'available' ? '✓ CÓ THỂ NÂNG' : '🔒 CHƯA MỞ KHÓA'}
                    </div>
                </div>

                ${requirementsHTML}

                <div style="margin-bottom: 15px; text-align: center; color: #c4a77d;">
                    Tiến độ: <strong style="color: #d4af37;">${nodeProgress.currentLevel}/${node.milestones.length}</strong>
                    | Đã dùng: <strong style="color: #4ade80;">${pointsSpent}</strong> điểm
                </div>

                <div class="milestone-list">
                    ${milestonesHTML}
                </div>

                <div class="progress-section">
                    <h3>⚡ Cập Nhật Tiến Độ</h3>
                    <div class="quick-btns">
                        ${node.milestones.map((_, index) => `
                            <button class="quick-btn ${nodeProgress.currentLevel === index + 1 ? 'style="background: rgba(74, 222, 128, 0.3); border-color: #4ade80;"' : ''}"
                                    onclick="setNodeProgress('${currentMap}', ${nodeIdArg}, ${index + 1})">
                                Mốc ${index + 1}
                            </button>
                        `).join('')}
                        <button class="quick-btn" style="background: rgba(220, 53, 69, 0.2); border-color: #ff6b6b;"
                                onclick="setNodeProgress('${currentMap}', ${nodeIdArg}, 0)">
                            Reset
                        </button>
                    </div>
                </div>
            `;
        }

        function updateStats() {
            // Calculate total points spent across ALL museums
            let totalPointsAllMaps = 0;

            Object.keys(MUSEUMS).forEach(mapId => {
                const museum = MUSEUMS[mapId];
                const nodes = Object.values(museum.nodes);

                nodes.forEach(node => {
                    const nodeProgress = getNodeProgress(mapId, node.id);

                    for (let i = 0; i < nodeProgress.currentLevel; i++) {
                        totalPointsAllMaps += node.milestones[i].points;
                    }
                });
            });

            document.getElementById('totalPointsAllMaps').textContent = totalPointsAllMaps.toLocaleString();
        }

        function resetAllNodes() {
            if (confirm('Bạn có chắc muốn reset toàn bộ node về 0 (tất cả bảo tàng)?')) {
                // Reset all nodes in all maps to level 0
                Object.keys(MUSEUMS).forEach(mapId => {
                    if (!progress[mapId]) progress[mapId] = { nodes: {} };
                    const museum = MUSEUMS[mapId];
                    Object.keys(museum.nodes).forEach(nodeId => {
                        progress[mapId].nodes[nodeId] = { currentLevel: 0 };
                    });
                });

                saveProgress();
                renderTree();
                updateStats();
                if (selectedNode !== null) {
                    showNodeDetail(selectedNode);
                }
                alert('Đã reset toàn bộ node về 0! ✅');
            }
        }

        // Initialize
        function init() {
            // Update title based on current map
            document.getElementById('mapTitle').textContent = `Bảo tàng ${MUSEUMS[currentMap].name}`;

            renderMuseumList();
            renderTree();
            updateStats();

            // Handle resize for connection lines
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(renderTree, 150);
            });
        }

        init();
    </script>
